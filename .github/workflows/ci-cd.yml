
name: CI/CD OpenShift

on:
  push:
    branches:
      - master
      - develop

  workflow_dispatch:

jobs:

  # ==========================================
  # JOB 1: PREVALIDACIÓN
  # ==========================================
  prevalidation:
    name: Prevalidar
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validación inicial
        run: |
          echo "Simulación de verificación de la estructura del repositorio realizada correctamente."

  # ==========================================
  # JOB 2: COMPILACIÓN
  # ==========================================
  build:
    name: Compilar
    runs-on: ubuntu-24.04
    needs: prevalidation

    steps:
      # 1. Descargar código
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Instalar Java 25
      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 3. Verificar Java
      - name: Verificar Java
        run: java -version

      # 4. Compilar con Gradle
      - name: Compilar con Gradle
        run: |
          chmod +x gradlew
          ./gradlew compileJava -x test

  # ==========================================
  # JOB 3: PRUEBAS Y COBERTURA
  # ==========================================
  test:
    name: Pruebas y Cobertura
    runs-on: ubuntu-24.04
    needs: build

    steps:
      # 1. Descargar el código
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Instalar Java 25
      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 3. Ejecutar pruebas y cobertura
      - name: Ejecutar Pruebas y Cobertura
        run: |
          chmod +x gradlew
          ./gradlew check

      # 4. Publicar resultados de cobertura
      - name: Publicar Cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: |
            **/build/reports/jacoco/test/jacocoTestReport.xml
            **/build/reports/jacoco/test/html/**
          if-no-files-found: warn

      # 5. Publicar resultados de pruebas
      - name: Publicar Reportes de Pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn

