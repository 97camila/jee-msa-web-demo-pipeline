
name: CI/CD OpenShift

on:
  push:
    branches:
      - master
      - develop

  workflow_dispatch:

jobs:

  # ==========================================
  # JOB 1: PREVALIDACIÓN
  # ==========================================
  prevalidation:
    name: Prevalidar
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validación inicial
        run: |
          echo "Simulación de verificación de la estructura del repositorio realizada correctamente."

  # ==========================================
  # JOB 2: COMPILACIÓN
  # ==========================================
  build:
    name: Compilar
    runs-on: ubuntu-24.04
    needs: prevalidation

    steps:
      # 1. Descargar código
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Instalar Java 25
      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 3. Verificar Java
      - name: Verificar Java
        run: java -version

      # 4. Compilar con Gradle
      - name: Compilar con Gradle
        run: |
          chmod +x gradlew
          ./gradlew compileJava -x test

  # ==========================================
  # JOB 3: PRUEBAS Y COBERTURA
  # ==========================================
  test:
    name: Pruebas y Cobertura
    runs-on: ubuntu-24.04
    needs: build

    steps:
      # 1. Descargar el código
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Instalar Java 25
      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 3. Ejecutar pruebas y cobertura
      - name: Ejecutar Pruebas y Cobertura
        run: |
          chmod +x gradlew
          ./gradlew check

      # 4. Publicar resultados de cobertura
      - name: Publicar Cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: |
            **/build/reports/jacoco/test/jacocoTestReport.xml
            **/build/reports/jacoco/test/html/**
          if-no-files-found: warn

      # 5. Publicar resultados de pruebas
      - name: Publicar Reportes de Pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn


  # ==========================================
  # JOB 4: VERIFICAR CONEXIÓN CON OPENSHIFT
  # ==========================================
  openshift_connection:
    name: Verificar conexión OpenShift
    runs-on: ubuntu-24.04
    needs: test

    steps:
      # 1. Instalar OpenShift CLI
      - name: Instalar OpenShift CLI
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            -o openshift-client-linux.tar.gz \
            https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz

          tar -xzf openshift-client-linux.tar.gz oc
          sudo install -m 0755 oc /usr/local/bin/oc

          oc version --client

      # 2. Autenticar en OpenShift
      - name: Login en OpenShift
        env:
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
        run: |
          set -euo pipefail

          oc login \
            --token="$OPENSHIFT_TOKEN" \
            --server="$OPENSHIFT_SERVER" \
            --insecure-skip-tls-verify=true

      # 3. Seleccionar el proyecto
      - name: Verificar proyecto OpenShift
        env:
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
        run: |
          set -euo pipefail

          oc login \
            --token="$OPENSHIFT_TOKEN" \
            --server="$OPENSHIFT_SERVER" \
            --insecure-skip-tls-verify=true

          oc project 97camilap-dev

          oc status

          
  # ==========================================
  # JOB 5: APROBACIÓN MANUAL
  # ==========================================
  approval:
    name: Aprobar despliegue
    runs-on: ubuntu-24.04
    needs: openshift_connection

    environment:
      name: openshift-sandbox

    steps:
      - name: Confirmar aprobación
        run: |
          echo "Aprobación manual completada."
          echo "Autorizado para desplegar en OpenShift."

          
  # ==========================================
  # JOB 6: DESPLIEGUE CONTINUO (CD)
  # ==========================================
  deploy_openshift:
    name: Desplegar en OpenShift
    runs-on: ubuntu-24.04
    needs: approval

    steps:
      # 1. Descargar el código
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Instalar OpenShift CLI
      - name: Instalar OpenShift CLI
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            -o openshift-client-linux.tar.gz \
            https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz

          tar -xzf openshift-client-linux.tar.gz oc
          sudo install -m 0755 oc /usr/local/bin/oc

          oc version --client

      # 3. Autenticarse en OpenShift
      - name: Login en OpenShift
        env:
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
        run: |
          oc login \
            --token="$OPENSHIFT_TOKEN" \
            --server="$OPENSHIFT_SERVER" \
            --insecure-skip-tls-verify=true

      # 4. Seleccionar proyecto
      - name: Seleccionar proyecto
        run: |
          oc project 97camilap-dev

      # 5. Aplicar manifiestos
      - name: Aplicar manifiestos OpenShift
        run: |
          oc apply -f helm/build-config.yaml
          oc apply -f helm/dev.yml
          oc apply -f helm/service.yaml
          oc apply -f helm/route.yaml

      # 6. Construir imagen Docker
      - name: Iniciar Build OpenShift
        run: |
          oc start-build jee-msa-web-demo-pipeline --follow

      # 7. Reiniciar Deployment
      - name: Reiniciar Deployment
        run: |
          oc rollout restart \
            deployment/jee-msa-web-demo-pipeline

      # 8. Esperar disponibilidad
      - name: Verificar despliegue
        run: |
          oc rollout status \
            deployment/jee-msa-web-demo-pipeline \
            --timeout=300s

      # 9. Mostrar URL
      - name: Obtener URL de aplicación
        run: |
          oc get route jee-msa-web-demo-pipeline \
            -o jsonpath='{"URL: http://"}{.spec.host}{"\n"}'


