apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: jee-msa-web-demo-pipeline
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: jee-msa-web-demo-pipeline
spec:
  source:
    type: Git
    git:
      uri: https://github.com/jefersonvillacis/jee-msa-web-demo-pipeline.git
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        namespace: openshift
        name: java:openjdk-17-ubi8
      env:
        # 1. Forzamos a Gradle a generar el fat jar
        - name: BUILDER_ARGS
          value: "bootJar -x test"
        # 2. Le decimos a OpenShift el nombre exacto del JAR generado
        - name: APP_FILE
          value: "app.jar"
  output:
    to:
      kind: ImageStreamTag
      name: jee-msa-web-demo-pipeline:latest