apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: jee-msa-web-demo-pipeline
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: jee-msa-web-demo-pipeline
spec:
  source:
    type: Git
    git:
      uri: https://github.com/jefersonvillacis/jee-msa-web-demo-pipeline.git
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        namespace: openshift
        name: java:openjdk-17-ubi8
  output:
    to:
      kind: ImageStreamTag
      name: jee-msa-web-demo-pipeline:latest