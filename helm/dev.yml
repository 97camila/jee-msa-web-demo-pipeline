apiVersion: apps/v1
kind: Deployment
metadata:
  name: jee-msa-web-demo-pipeline
  labels:
    app: jee-msa-web-demo-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jee-msa-web-demo-pipeline
  template:
    metadata:
      labels:
        app: jee-msa-web-demo-pipeline
    spec:
      containers:
        - name: java-app
          image: image-registry.openshift-image-registry.svc:5000/testing-account-dev/jee-msa-web-demo-pipeline:latest
          ports:
            - containerPort: 8080
