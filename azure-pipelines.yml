# ==========================================
# TRIGGERS: SE ACTIVA SOLO AL CONSOLIDAR CÓDIGO
# ==========================================
trigger:
  branches:
    include:
      - master
      - develop

pool:
  vmImage: 'ubuntu-latest'

stages:

  # ==========================================
  # STAGE 1: INTEGRACIÓN CONTINUA (CI)
  # ==========================================
  - stage: CI
    displayName: 'Integración Continua'
    jobs:
      - job: prevalidation
        displayName: 'Prevalidaciones de Código'
        steps:
          - script: echo "Estructura del repositorio verificada correctamente por Jeferson Villacis."
            displayName: 'Chequeo inicial'

      - job: build
        displayName: 'Compilación (Build)'
        dependsOn: prevalidation
        steps:
          - script: |
              echo "=== Descargando e instalando JDK 25 (Temurin) ==="
              wget -q https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25%2B36/OpenJDK25U-jdk_x64_linux_hotspot_25_36.tar.gz -O /tmp/jdk25.tar.gz
              sudo mkdir -p /opt/java
              sudo tar -xzf /tmp/jdk25.tar.gz -C /opt/java
              export JAVA_HOME=$(find /opt/java -maxdepth 1 -type d -name "jdk-25*" | head -n 1)
              export PATH=$JAVA_HOME/bin:$PATH
              echo "JAVA_HOME configurado en: $JAVA_HOME"
              java -version

              echo "=== Dando permisos de ejecución a Gradle ==="
              chmod +x gradlew

              echo "=== Compilando con Gradle ==="
              ./gradlew compileJava -x test
            displayName: 'Instalar Java 25 y Compilar'

      - job: test
        displayName: 'Pruebas Unitarias y Cobertura (JaCoCo)'
        dependsOn: build
        steps:
          - script: |
              echo "=== Instalando JDK 25 para Tests ==="
              wget -q https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25%2B36/OpenJDK25U-jdk_x64_linux_hotspot_25_36.tar.gz -O /tmp/jdk25.tar.gz
              sudo mkdir -p /opt/java
              sudo tar -xzf /tmp/jdk25.tar.gz -C /opt/java
              export JAVA_HOME=$(find /opt/java -maxdepth 1 -type d -name "jdk-25*" | head -n 1)
              export PATH=$JAVA_HOME/bin:$PATH

              echo "=== Dando permisos de ejecución a Gradle ==="
              chmod +x gradlew

              echo "=== Ejecutar Pruebas y Verificar Cobertura ==="
              ./gradlew check
            displayName: 'Instalar Java, Ejecutar Pruebas y Cobertura'

          # Publica el reporte visual de JaCoCo
          - task: PublishCodeCoverageResults@2
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/build/reports/jacoco/test/jacocoTestReport.xml'
              pathToSources: '$(System.DefaultWorkingDirectory)/src/main/java'
            displayName: 'Publicar Cobertura en Azure DevOps'

  # ==========================================
  # STAGE 2: APROBACIÓN MANUAL (APPROVAL)
  # ==========================================
  - stage: Approval
    displayName: 'Aprobación'
    dependsOn: CI
    condition: succeeded()
    jobs:
      - job: manual_gate
        displayName: 'Esperando aprobación'
        pool: server
        steps:
          - task: ManualValidation@0
            inputs:
              notifyUsers: 'jefersonvillacis@hotmail.com'
              instructions: 'Aprobación requerida para ejecutar la fase de despliegue continuo en OpenShift Sandbox.'
              onTimeout: 'reject'

  # ==========================================
  # STAGE 3: DESPLIEGUE CONTINUO (CD)
  # ==========================================
  - stage: CD
    displayName: 'Despliegue Continuo'
    dependsOn: Approval
    condition: succeeded()
    jobs:
      - job: deploy_openshift
        displayName: 'Desplegar en OpenShift (Vía Script)'
        steps:
          - script: |
              echo "=== 1. Descargando e instalando OpenShift CLI (oc) ==="
              curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
              tar -xzf openshift-client-linux.tar.gz
              sudo mv oc /usr/local/bin/
              sudo mv kubectl /usr/local/bin/ || true
              oc version --client

              echo "=== 2. Autenticando en el Clúster ==="
              oc login --token=$(OPENSHIFT_TOKEN) --server=$(OPENSHIFT_SERVER) --insecure-skip-tls-verify=true
              
              echo "=== 3. Seleccionando Proyecto (Namespace) ==="
              oc project testing-account-dev
              
              echo "=== 4. Aplicando Manifiestos ==="
              oc apply -f helm/build-config.yaml
              
              echo "=== 5. Iniciando Construcción de Imagen ==="
              oc start-build jee-msa-web-demo-pipeline --follow
              
              echo "=== 6. Desplegando Aplicación ==="
              oc apply -f helm/
              
              echo "=== 7. Obteniendo URL de la Aplicación ==="
              oc get route jee-msa-web-demo-pipeline -o jsonpath='{"URL: http://"}{.spec.host}{"\n"}'
            displayName: 'Descarga CLI, Login y Despliegue'

  # ==========================================
  # STAGE 4: NOTIFICACIONES (NOTIFICATIONS)
  # ==========================================
  - stage: Notifications
    displayName: 'Fase de Notificaciones'
    dependsOn: [CI, Approval, CD]
    condition: always()
    jobs:
      - job: send_status_email
        displayName: 'Enviar Reporte por Correo'
        steps:
          - script: |
              echo "Estado de la ejecución final del pipeline de Jeferson: $(Agent.JobStatus)"
            displayName: 'Simulación de Envío de Correo de Estado'